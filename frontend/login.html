<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksha Setu — Select Your Role</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        command: {
                            950: '#060d17',
                            900: '#0c1524',
                            800: '#162238',
                            700: '#1e293b',
                            600: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .role-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .role-card:hover {
            transform: translateY(-4px);
        }
        .glow-orange { box-shadow: 0 0 40px rgba(249,115,22,0.15); }
        .glow-purple { box-shadow: 0 0 40px rgba(168,85,247,0.15); }
        .glow-blue   { box-shadow: 0 0 40px rgba(59,130,246,0.15);  }
        .role-card:hover.glow-orange { box-shadow: 0 8px 60px rgba(249,115,22,0.30); }
        .role-card:hover.glow-purple { box-shadow: 0 8px 60px rgba(168,85,247,0.30); }
        .role-card:hover.glow-blue   { box-shadow: 0 8px 60px rgba(59,130,246,0.30);  }
    </style>
</head>

<body class="min-h-full flex flex-col items-center px-4 pt-14 pb-12 bg-slate-950 text-slate-100 font-sans overflow-y-auto">

    <!-- Background Ambient Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-32 left-1/4 w-[500px] h-[400px] bg-orange-600/10 blur-3xl rounded-full"></div>
        <div class="absolute bottom-0 right-1/4 w-[400px] h-[400px] bg-blue-600/10 blur-3xl rounded-full"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[400px] bg-purple-600/5 blur-3xl rounded-full"></div>
    </div>

    <div class="relative z-10 w-full max-w-4xl mx-auto">

        <!-- Header -->
        <div class="text-center mb-10 flex flex-col items-center gap-4">

            <!-- Logo -->
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden shadow-2xl shadow-orange-500/40 ring-2 ring-orange-500/50 p-[3px] bg-gradient-to-br from-orange-500 via-red-500 to-blue-600 shrink-0">
                <img
                    src="logo.jpg"
                    alt="Raksha Setu Logo"
                    class="w-full h-full object-cover rounded-[13px]"
                    onerror="this.src='/assets/logo.jpg'; this.onerror=function(){this.style.display='none'; this.parentElement.innerHTML='<div class=\'w-full h-full bg-gradient-to-br from-orange-500 via-red-600 to-blue-600 flex items-center justify-center text-white text-4xl\'>🚨</div>';}">
            </div>

            <!-- Title -->
            <div class="flex flex-col items-center gap-1">
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">Raksha Setu</h1>
                <p class="text-sm text-slate-400">National Emergency Operations &amp; Citizen Safety Command</p>
            </div>

            <!-- Status pill -->
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-slate-800/60 border border-slate-700 rounded-full text-xs text-slate-400 font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Select your access portal to continue
            </div>

        </div>

        <!-- Role Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- CITIZEN / USER -->
            <button onclick="enterAs('USER')"
                class="role-card glow-orange group relative flex flex-col items-center text-center p-8 bg-slate-900/80 backdrop-blur border border-slate-700 hover:border-orange-500/60 rounded-3xl cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center text-3xl mb-5 shadow-lg shadow-orange-500/20 group-hover:scale-110 transition-transform duration-200">
                    👥
                </div>
                <span class="text-[10px] font-black uppercase tracking-widest text-orange-400 mb-2">Citizen Portal</span>
                <h2 class="text-xl font-extrabold text-white mb-3">User</h2>
                <p class="text-xs text-slate-400 leading-relaxed mb-6">
                    Report incidents, track disasters, find shelters, and register missing persons in your area.
                </p>
                <div class="mt-auto w-full py-2.5 rounded-xl bg-orange-600/20 border border-orange-500/30 text-orange-300 text-xs font-bold group-hover:bg-orange-600 group-hover:text-white transition-colors duration-200">
                    Enter as Citizen →
                </div>
                <div class="mt-3 flex flex-wrap justify-center gap-1.5">
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">SOS Reports</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Find Shelters</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Live Map</span>
                </div>
            </button>

            <!-- AUTHORITY -->
            <button onclick="enterAs('AUTHORITY_VERIFIED')"
                class="role-card glow-purple group relative flex flex-col items-center text-center p-8 bg-slate-900/80 backdrop-blur border border-slate-700 hover:border-purple-500/60 rounded-3xl cursor-pointer">
                <!-- Recommended Badge -->
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-0.5 bg-purple-600 text-white text-[10px] font-black rounded-full uppercase tracking-wider shadow-lg">
                    Operations
                </div>
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center text-3xl mb-5 shadow-lg shadow-purple-500/20 group-hover:scale-110 transition-transform duration-200">
                    🛡️
                </div>
                <span class="text-[10px] font-black uppercase tracking-widest text-purple-400 mb-2">Authority Portal</span>
                <h2 class="text-xl font-extrabold text-white mb-3">Authority</h2>
                <p class="text-xs text-slate-400 leading-relaxed mb-6">
                    Manage disasters, coordinate shelters, dispatch resources, broadcast alerts and run field operations.
                </p>
                <div class="mt-auto w-full py-2.5 rounded-xl bg-purple-600/20 border border-purple-500/30 text-purple-300 text-xs font-bold group-hover:bg-purple-600 group-hover:text-white transition-colors duration-200">
                    Enter as Authority →
                </div>
                <div class="mt-3 flex flex-wrap justify-center gap-1.5">
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Command Center</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Alerts</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Resources</span>
                </div>
            </button>

            <!-- ADMIN -->
            <button onclick="enterAs('ADMIN')"
                class="role-card glow-blue group relative flex flex-col items-center text-center p-8 bg-slate-900/80 backdrop-blur border border-slate-700 hover:border-blue-500/60 rounded-3xl cursor-pointer">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-3xl mb-5 shadow-lg shadow-blue-500/20 group-hover:scale-110 transition-transform duration-200">
                    ⚡
                </div>
                <span class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">Admin Portal</span>
                <h2 class="text-xl font-extrabold text-white mb-3">Administrator</h2>
                <p class="text-xs text-slate-400 leading-relaxed mb-6">
                    Full system control — manage users, approve authority roles, oversee all operations nationally.
                </p>
                <div class="mt-auto w-full py-2.5 rounded-xl bg-blue-600/20 border border-blue-500/30 text-blue-300 text-xs font-bold group-hover:bg-blue-600 group-hover:text-white transition-colors duration-200">
                    Enter as Admin →
                </div>
                <div class="mt-3 flex flex-wrap justify-center gap-1.5">
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">User Management</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Full Access</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Audit</span>
                </div>
            </button>

        </div>

        <!-- Footer -->
        <p class="text-center text-[11px] text-slate-600 mt-10">
            Disaster Management Act 2005 Compliant &nbsp;•&nbsp; 24×7 NDMA Helpline <span class="font-mono text-slate-400 font-bold">1078</span>
        </p>
    </div>

    <script>
        const MOCK_USERS = {
            USER: {
                id: 1,
                name: "Citizen User",
                email: "citizen@disasterhub.in",
                role: "USER",
                phone_number: "+919876543210",
                avatar_url: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150"
            },
            AUTHORITY_VERIFIED: {
                id: 2,
                name: "Authority Officer",
                email: "authority@ndrf.gov.in",
                role: "AUTHORITY_VERIFIED",
                phone_number: "+919811122233",
                avatar_url: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150"
            },
            ADMIN: {
                id: 3,
                name: "National Administrator",
                email: "admin@disasterhub.gov.in",
                role: "ADMIN",
                phone_number: "+919999888877",
                avatar_url: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150"
            }
        };

        function enterAs(role) {
            const user = MOCK_USERS[role];
            if (!user) return;
            localStorage.setItem("selected_role", role);
            localStorage.setItem("auth_user", JSON.stringify(user));
            window.location.replace("index.html");
        }
    </script>
</body>

</html>
